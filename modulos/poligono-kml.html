<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLIGONO KML</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1100px; background: white; margin: 0 auto; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #27ae60; padding-bottom: 10px; margin-top: 0; font-size: 26px; letter-spacing: 1px; }
        p { color: #555; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 8px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #2c3e50; color: white; font-weight: 600; font-size: 13px; }
        input, select { padding: 6px; width: 88%; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 13px; box-sizing: border-box; }
        input[type="text"] { text-align: left; width: 95%; }
        .btn { color: white; border: none; padding: 10px 15px; font-size: 14px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px; margin-bottom: 10px; }
        .btn-gen { background-color: #27ae60; }
        .btn-gen:hover { background-color: #219152; }
        .btn-add { background-color: #2980b9; }
        .btn-add:hover { background-color: #2471a3; }
        .btn-rem { background-color: #c0392b; }
        .btn-rem:hover { background-color: #962d22; }
        .opciones-kml { background: #f8f9fa; border: 1px solid #e2e8f0; padding: 15px; border-radius: 6px; margin-top: 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
        .opciones-kml label { font-weight: bold; font-size: 14px; color: #2c3e50; }
        .opciones-kml select { width: auto; padding: 6px 12px; }
        .actions { margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>POLIGONO KML</h1>
    <p>Ingrese los puntos del área en formato Grados, Minutos y Segundos. Seleccione el color deseado para el polígono y presione el botón verde para descargar el archivo directo para Google Earth.</p>
    
    <table id="tabla-puntos">
        <thead>
            <tr>
                <th style="width: 12%;">PUNTO</th>
                <th>LAT GRADOS</th>
                <th>LAT MINUTOS</th>
                <th>LAT SEGUNDOS</th>
                <th style="width: 8%;">HEMI</th>
                <th>LON GRADOS</th>
                <th>LON MINUTOS</th>
                <th>LON SEGUNDOS</th>
                <th style="width: 8%;">HEMI</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="text" value="PSN 1"></td>
                <td><input type="number" value="47"></td>
                <td><input type="number" value="46"></td>
                <td><input type="number" step="any" value="0.6"></td>
                <td><select><option value="S" selected>S</option><option value="N">N</option></select></td>
                <td><input type="number" value="61"></td>
                <td><input type="number" value="40"></td>
                <td><input type="number" step="any" value="39.0"></td>
                <td><select><option value="W" selected>W</option><option value="E">E</option></select></td>
            </tr>
            <tr>
                <td><input type="text" value="PSN 2"></td>
                <td><input type="number" value="47"></td>
                <td><input type="number" value="3"></td>
                <td><input type="number" step="any" value="22.8"></td>
                <td><select><option value="S" selected>S</option><option value="N">N</option></select></td>
                <td><input type="number" value="61"></td>
                <td><input type="number" value="59"></td>
                <td><input type="number" step="any" value="37.8"></td>
                <td><select><option value="W" selected>W</option><option value="E">E</option></select></td>
            </tr>
            <tr>
                <td><input type="text" value="PSN 3"></td>
                <td><input type="number" value="46"></td>
                <td><input type="number" value="56"></td>
                <td><input type="number" step="any" value="0.6"></td>
                <td><select><option value="S" selected>S</option><option value="N">N</option></select></td>
                <td><input type="number" value="61"></td>
                <td><input type="number" value="28"></td>
                <td><input type="number" step="any" value="33.0"></td>
                <td><select><option value="W" selected>W</option><option value="E">E</option></select></td>
            </tr>
            <tr>
                <td><input type="text" value="PSN 4"></td>
                <td><input type="number" value="47"></td>
                <td><input type="number" value="38"></td>
                <td><input type="number" step="any" value="57.0"></td>
                <td><select><option value="S" selected>S</option><option value="N">N</option></select></td>
                <td><input type="number" value="61"></td>
                <td><input type="number" value="11"></td>
                <td><input type="number" step="any" value="24.6"></td>
                <td><select><option value="W" selected>W</option><option value="E">E</option></select></td>
            </tr>
        </tbody>
    </table>

    <div class="opciones-kml">
        <label for="color-poligono">🎨 Color del Polígono:</label>
        <select id="color-poligono">
            <option value="verde" selected>Verde Línea / Relleno Transparente</option>
            <option value="rojo">Rojo Línea / Relleno Transparente</option>
            <option value="azul">Azul Línea / Relleno Transparente</option>
            <option value="amarillo">Amarillo Línea / Relleno Transparente</option>
            <option value="naranja">Naranja Línea / Relleno Transparente</option>
        </select>
    </div>

    <div class="actions">
        <button class="btn btn-add" onclick="agregarFila()">+ Agregar Punto</button>
        <button class="btn btn-rem" onclick="quitarFila()">- Quitar Último Punto</button>
        <button class="btn btn-gen" onclick="descargarKML()">📥 Generar KML</button>
    </div>
</div>

<script>
    function agregarFila() {
        const tbody = document.querySelector("#tabla-puntos tbody");
        const rowCount = tbody.rows.length + 1;
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td><input type="text" value="PSN ${rowCount}"></td>
            <td><input type="number" placeholder="0"></td>
            <td><input type="number" placeholder="0"></td>
            <td><input type="number" step="any" placeholder="0.0"></td>
            <td><select><option value="S" selected>S</option><option value="N">N</option></select></td>
            <td><input type="number" placeholder="0"></td>
            <td><input type="number" placeholder="0"></td>
            <td><input type="number" step="any" placeholder="0.0"></td>
            <td><select><option value="W" selected>W</option><option value="E">E</option></select></td>
        `;
        tbody.appendChild(tr);
    }

    function quitarFila() {
        const tbody = document.querySelector("#tabla-puntos tbody");
        if (tbody.rows.length > 3) {
            tbody.removeChild(tbody.lastChild);
        } else {
            alert("El polígono necesita un mínimo de 3 puntos.");
        }
    }

    function convertirADecimal(grados, minutos, segundos, hemisferio) {
        let g = parseFloat(grados) || 0;
        let m = parseFloat(minutos) || 0;
        let s = parseFloat(segundos) || 0;
        
        let decimal = g + (m / 60) + (s / 3600);
        
        if (hemisferio === "S" || hemisferio === "W") {
            decimal = -decimal;
        }
        return decimal.toFixed(6);
    }

    function obtenerCodigosColor(colorSeleccionado) {
        // Formato KML es AABBGGRR (Alpha, Blue, Green, Red)
        switch(colorSeleccionado) {
            case 'rojo':
                return { linea: 'ff0000ff', relleno: '400000ff' }; // Rojo
            case 'azul':
                return { linea: 'ffff0000', relleno: '40ff0000' }; // Azul
            case 'amarillo':
                return { linea: 'ff00ffff', relleno: '4000ffff' }; // Amarillo
            case 'naranja':
                return { linea: 'ff00a5ff', relleno: '4000a5ff' }; // Naranja
            case 'verde':
            default:
                return { linea: 'ff00ff00', relleno: '4000ff00' }; // Verde original
        }
    }

    function descargarKML() {
        const rows = document.querySelectorAll("#tabla-puntos tbody tr");
        let coordenadasKML = [];
        let primerPunto = "";

        for (let i = 0; i < rows.length; i++) {
            const inputs = rows[i].querySelectorAll("input, select");
            
            const gLat = inputs[1].value;
            const mLat = inputs[2].value;
            const sLat = inputs[3].value;
            const hLat = inputs[4].value;
            
            const gLon = inputs[5].value;
            const mLon = inputs[6].value;
            const sLon = inputs[7].value;
            const hLon = inputs[8].value;

            if (!gLat || !gLon) continue;

            const latDec = convertirADecimal(gLat, mLat, sLat, hLat);
            const lonDec = convertirADecimal(gLon, mLon, sLon, hLon);
            
            const ptoStr = `${lonDec},${latDec},0`;
            coordenadasKML.push(ptoStr);

            if (i === 0) {
                primerPunto = ptoStr;
            }
        }

        if (coordenadasKML.length < 3) {
            alert("Por favor ingrese al menos 3 o 4 puntos válidos antes de generar.");
            return;
        }

        coordenadasKML.push(primerPunto);
        const listaCoordenadasTexto = coordenadasKML.join(" ");

        // Obtener la configuración de color seleccionada por el usuario
        const colorElegido = document.getElementById("color-poligono").value;
        const codigosColor = obtenerCodigosColor(colorElegido);

        const kmlCompleto = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Poligono de Operaciones</name>
    <Style id="estiloPoligono">
      <LineStyle>
        <color>${codigosColor.linea}</color>
        <width>3</width>
      </LineStyle>
      <PolyStyle>
        <color>${codigosColor.relleno}</color>
      </PolyStyle>
    </Style>
    <Placemark>
      <name>Area Delimitada</name>
      <styleUrl>#estiloPoligono</styleUrl>
      <Polygon>
        <outerBoundaryIs>
          <LinearRing>
            <coordinates>${listaCoordenadasTexto}</coordinates>
          </LinearRing>
        </outerBoundaryIs>
      </Polygon>
    </Placemark>
  </Document>
</kml>`;
        
        const blob = new Blob([kmlCompleto], { type: "application/vnd.google-earth.kml+xml" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Poligono_Area.kml";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
